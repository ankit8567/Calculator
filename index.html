<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fancy Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <!-- Header -->
        <div class="calculator-header">
            <div>
                <p class="small-title">SMART CALCULATOR</p>
                <h1>Calculator</h1>
            </div>

            <div class="calculator-icon">⌘</div>
        </div>


        <!-- Display -->
        <div class="display-box">

            <div id="history"></div>

            <input
                type="text"
                id="display"
                value="0"
                readonly
            >

        </div>


        <!-- Buttons -->
        <div class="buttons">

            <button class="function" onclick="clearDisplay()">AC</button>
            <button class="function" onclick="deleteLast()">⌫</button>
            <button class="function" onclick="addValue('%')">%</button>
            <button class="operator" onclick="addValue('/')">÷</button>


            <button onclick="addValue('7')">7</button>
            <button onclick="addValue('8')">8</button>
            <button onclick="addValue('9')">9</button>
            <button class="operator" onclick="addValue('*')">×</button>


            <button onclick="addValue('4')">4</button>
            <button onclick="addValue('5')">5</button>
            <button onclick="addValue('6')">6</button>
            <button class="operator" onclick="addValue('-')">−</button>


            <button onclick="addValue('1')">1</button>
            <button onclick="addValue('2')">2</button>
            <button onclick="addValue('3')">3</button>
            <button class="operator" onclick="addValue('+')">+</button>


            <button class="zero" onclick="addValue('0')">0</button>
            <button onclick="addValue('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>

        </div>


        <div class="footer">
            <span>⌨ Keyboard supported</span>
            <span>•</span>
            <span>Fast & Simple</span>
        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
